services:
  - type: web
    name: rescueme
    runtime: docker
    plan: free
    autoDeploy: true
    envVars:
      - key: RESCUEME_PUBLIC_MODE
        value: "true"
      - key: RESCUEME_NODE_NAME
        value: RescueMe Public Node
      - key: RESCUEME_ADMIN_TOKEN
        sync: false
      - key: RESCUEME_RESPONDER_TOKEN
        sync: false
      - key: RESCUEME_REQUIRE_HTTPS
        value: "true"
      - key: RESCUEME_DISABLE_RATE_LIMITING
        value: "false"

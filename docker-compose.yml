services:
  backend:
    build: ./backend
    environment:
      RESCUEME_NODE_NAME: RescueMe Docker Node
      RESCUEME_DB_PATH: /data/rescueme.db
    ports:
      - "8000:8000"
    volumes:
      - rescueme-data:/data

  frontend:
    build: ./frontend
    environment:
      VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  rescueme-data:
